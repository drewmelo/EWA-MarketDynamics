name: Deploy to shinyapps.io

on:
  push:
    branches: [ "master" ]   # ajuste se sua default branch for 'main'
    tags:
      - 'v*'                 # v1.0.0, v1.2.3 etc.

jobs:
  deploy:
    # roda se o commit tiver "deploy:" OU se for push de tag v*
    if: contains(github.event.head_commit.message, 'deploy:') || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-pandoc@v2

      # (opcional) espelho CRAN mais estável
      - name: Set CRAN mirror
        run: |
          echo 'options(repos = c(CRAN = "https://packagemanager.posit.co/cran/latest"))' >> ~/.Rprofile

      - name: Install pak
        run: |
          R -q -e 'install.packages("pak", repos="https://r-lib.github.io/p/pak/stable/")'

      - name: Install rsconnect
        run: |
          R -q -e 'pak::pak("rsconnect")'
          R -q -e 'if (!requireNamespace("rsconnect", quietly=TRUE)) stop("rsconnect not installed")'

      - name: Restore deps with renv (if present)
        run: |
          R -q -e 'if (!requireNamespace("renv", quietly=TRUE)) install.packages("renv")'
          R -q -e 'if (file.exists("renv.lock")) renv::restore()'

      - name: Check dependency detection
        run: |
          R -q -e 'deps <- rsconnect::appDependencies("."); print(deps); if (!"shiny" %in% deps$Package) stop("Manifest não detectou o pacote shiny")'

      - name: Deploy
        env:
          SHINYAPPS_NAME:   ${{ secrets.SHINYAPPS_NAME }}
          SHINYAPPS_TOKEN:  ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          R -q -e 'rsconnect::setAccountInfo(name=Sys.getenv("SHINYAPPS_NAME"), token=Sys.getenv("SHINYAPPS_TOKEN"), secret=Sys.getenv("SHINYAPPS_SECRET"))'
          R -q -e 'rsconnect::deployApp(appDir=".", appPrimaryDoc="app.R", appName="ewa-market-dynamics", server="shinyapps.io", forceUpdate=TRUE)'
