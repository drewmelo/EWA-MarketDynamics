name: Deploy to shinyapps.io

on:
  push:
    branches: [ "master" ]   # dispara em commits na master
    tags:
      - 'v*'                 # dispara em tags do tipo v1.0.0, v1.2.3 etc.

jobs:
  deploy:
    # só roda se o último commit tiver "deploy:" OU se for uma tag
    if: contains(github.event.head_commit.message, 'deploy:') || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-pandoc@v2

      # Instala pak (rápido e confiável)
      - name: Install pak
        run: |
          R -q -e 'install.packages("pak", repos="https://r-lib.github.io/p/pak/stable/")'

      # Instala dependências, incluindo rsconnect
      - name: Install deps
        run: |
          R -q -e 'pak::pak("rsconnect")'
          R -q -e 'if (file.exists("renv.lock")) pak::pak("renv"); if (file.exists("renv.lock")) renv::restore()'
          R -q -e 'if (!requireNamespace("rsconnect", quietly = TRUE)) stop("rsconnect not installed")'

      - name: Deploy
        env:
          SHINYAPPS_NAME:   ${{ secrets.SHINYAPPS_NAME }}
          SHINYAPPS_TOKEN:  ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          R -q -e 'rsconnect::setAccountInfo(
                      name   = Sys.getenv("SHINYAPPS_NAME"),
                      token  = Sys.getenv("SHINYAPPS_TOKEN"),
                      secret = Sys.getenv("SHINYAPPS_SECRET")
                    )'
          R -q -e 'rsconnect::deployApp(
                      appDir = ".",
                      appName = "ewa-market-dynamics",
                      server = "shinyapps.io",
                      forceUpdate = TRUE
                    )'
