name: Build Shinylive to docs

on:
  push:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Configura R e define CRAN automaticamente (RStudio Public Package Manager)
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      # Fallback explícito do mirror (garante que qualquer install.packages use CRAN correto)
      - name: Force CRAN mirror (fallback)
        run: |
          echo 'options(repos = c(CRAN = "https://packagemanager.posit.co/cran/latest"))' >> ~/.Rprofile
          R -q -e 'getOption("repos")'

      - name: Install shinylive
        run: R -q -e 'install.packages("shinylive", repos="https://packagemanager.posit.co/cran/latest")'

      - name: Export app to docs
        run: R -q -e 'shinylive::export(appdir=".", destdir="docs", wasm_packages=FALSE)'

      - name: Commit docs if changed
        run: |
          if [ -n "$(git status --porcelain docs)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs
            git commit -m "build(shinylive): export to docs"
            git push
          fi
