name: Build Shinylive to docs

on:
  push:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true   

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install shinylive
        run: R -q -e 'install.packages("shinylive")'

      - name: Export app to docs
        run: R -q -e 'shinylive::export(appdir=".", destdir="docs", wasm_packages=FALSE)'

      - name: Commit docs if changed
        run: |
          if [ -n "$(git status --porcelain docs)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs
            git commit -m "build(shinylive): export to docs"
            git push
          fi
