name: Build Shinylive to docs

on:
  push:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true   # define CRAN (RSPM)

      - uses: r-lib/actions/setup-pandoc@v2

      # 🔧 Dependências de sistema para curl/httr2/gh/archive/pkgdepends
      - name: Install system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libarchive-dev \
            pkg-config \
            libssl-dev \
            zlib1g-dev \
            libxml2-dev \
            build-essential

      # ✅ Instala e exporta no MESMO passo (com CRAN explícito)
      - name: Install + Export Shinylive
        run: |
          R -q -e "install.packages('shinylive', repos='https://packagemanager.posit.co/cran/latest')"
          R -q -e "shinylive::export(appdir='.', destdir='docs', wasm_packages=FALSE)"

      # ✍️ Comita docs/ se mudou
      - name: Commit docs if changed
        run: |
          if [ -n "$(git status --porcelain docs)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs
            git commit -m "build(shinylive): export to docs"
            git push
          fi
